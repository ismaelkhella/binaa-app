name: binaa_academy
description: "Bina Academy — Tawjihi tutoring platform (Grades 11/12)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1
  socket_io_client: ^3.0.0

  # Routing
  go_router: ^14.2.7

  # Local storage
  shared_preferences: ^2.3.2

  # Typography
  google_fonts: ^6.2.1

  # Media
  cached_network_image: ^3.4.1
  video_player: ^2.8.6
  youtube_player_flutter: ^9.1.1
  webview_flutter: ^4.10.0

  # Animations
  animations: ^2.0.11

  # Formatting
  intl: ^0.20.2

  # Connectivity
  connectivity_plus: ^6.1.1

  # Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # Downloads
  background_downloader: ^8.1.1

  # Security & Files
  screen_protector: ^1.5.2
  path_provider: ^2.1.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
